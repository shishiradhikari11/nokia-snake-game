<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Nokia Snake</title>
  <!-- YouTube Playables SDK: must be loaded before any other script. -->
  <script src="https://www.youtube.com/game_api/v1"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <div id="lcd">
      <div id="hud">
        <span id="score">0000</span>
        <span id="level">L1</span>
        <span id="best">HI 0000</span>
      </div>
      <canvas id="board" aria-label="Snake game board"></canvas>
      <div id="toast" class="hidden"></div>
      <div id="overlay">
        <p id="overlay-title">SNAKE</p>
        <p id="overlay-text"></p>
        <div id="menu"></div>
      </div>
    </div>
    <div id="pad" aria-hidden="true">
      <button data-dir="up">&#9650;</button>
      <button data-dir="left">&#9664;</button>
      <button data-dir="pause" id="pause-btn">II</button>
      <button data-dir="right">&#9654;</button>
      <button data-dir="down">&#9660;</button>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
